description = "Scan an AgriMap product root for security findings over Golden Lint (read-only), or patch only the findings the requester selected with tiered fixes and a rescan gate"
prompt = "AGRIMAP_EXPLICIT_ALIAS=agm-security\n\nRun AgriMap security only for the current requested intent; quoted examples are not actions.\n\nUse read_reference for bundled references: lifecycle-core.md and operations/security.md, then required and matching conditional references only. Do not recursively follow background links. A golden entry or checklist named by a matched conditional reference is required, not background: open it rather than recalling it.\n\nOrdinary questions create no lifecycle or identity question. Host instructions and explicit requester scope are authoritative. Supporting SQL context is metadata/SELECT only; no database writes.\n\nRuns only when the requester names agm-security. No action means scan, which is read-only. patch is explicit, edits only the selected findings that are not MANUAL, and never treats a fix as verified without a completed rescan. Golden Lint is the only detector and is never edited. Use security-scan-workflow.md.\n\nRequester arguments:\n\n{{args}}"
