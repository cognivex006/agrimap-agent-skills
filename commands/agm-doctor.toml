description = "Check AGM installation versions, host compatibility and workflow dependencies, or update the selected host's AGM package and its installed companions (golden-lint, sql-context-pack)"
prompt = "AGRIMAP_EXPLICIT_ALIAS=agm-doctor\n\nRun AgriMap doctor only for the current requested intent; quoted examples are not actions.\n\nUse read_reference for bundled references: lifecycle-core.md and operations/doctor.md, then required and matching conditional references only. Do not recursively follow background links. A golden entry or checklist named by a matched conditional reference is required, not background: open it rather than recalling it.\n\nOrdinary questions create no lifecycle or identity question. Host instructions and explicit requester scope are authoritative. Supporting SQL context is metadata/SELECT only; no database writes.\n\nNo arguments means read-only status. version and check are read-only too: no identity question, lifecycle, installation, cache refresh or project bootstrap. Only an explicit update authorizes changing the selected host's AGM installation. Resolve host from runtime evidence, never from the model name. --host gemini identifies legacy Gemini only, not Antigravity; explain migration without changing either installation. Use doctor-workflow.md; do not load product release prerequisites.\n\nRequester arguments:\n\n{{args}}"
